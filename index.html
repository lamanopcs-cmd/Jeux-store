<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#063c2d;
    color:white;
    min-height:100vh;
}

button{
    font-family:inherit;
}

.header{
    text-align:center;
    padding:20px 15px 10px;
}

.back{
    text-align:left;
    font-size:32px;
    margin-bottom:5px;
    cursor:pointer;
}

.header h1{
    font-size:25px;
    line-height:1.15;
    margin-bottom:15px;
}

.logo{
    display:flex;
    justify-content:center;
    gap:5px;
    margin-bottom:18px;
}

.logo div{
    background:#ffd400;
    color:#073c2e;
    font-size:36px;
    font-weight:900;
    width:60px;
    height:60px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:12px;
    transform:rotate(-2deg);
}

.logo div:nth-child(2){
    transform:rotate(2deg);
}

.logo div:nth-child(3){
    transform:rotate(-5deg);
}

.logo div:nth-child(4){
    transform:rotate(3deg);
}

.logo div:nth-child(5){
    transform:rotate(-3deg);
}

/* PHOTO PRINCIPALE */
.main-img{
    width:220px;
    height:220px;
    object-fit:cover;
    border-radius:18px;
    display:block;
    margin:0 auto 20px;
    border:4px solid #ffd400;
}

/* ONGLETS */
.tabs{
    display:flex;
    margin:5px 15px 18px;
    gap:0;
    overflow:hidden;
    border-radius:18px;
}

.tab{
    flex:1;
    padding:16px 8px;
    background:#063225;
    color:white;
    text-align:center;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.tab.active{
    background:#ffd400;
    color:#073c2e;
}

/* THEMES */
.theme-list{
    padding:0 15px 30px;
}

.theme-card{
    background:#f6e5c5;
    color:#333;
    border-radius:20px;
    margin:12px 0;
    min-height:130px;
    display:flex;
    align-items:center;
    overflow:hidden;
    cursor:pointer;
    transition:.15s;
}

.theme-card:active{
    transform:scale(.98);
}

.theme-info{
    padding:16px;
    width:50%;
}

.theme-info h3{
    color:#e87b00;
    font-size:25px;
    margin-bottom:5px;
}

.theme-info p{
    font-size:16px;
    margin-bottom:12px;
}

.theme-icons{
    display:flex;
    align-items:center;
    gap:8px;
}

.flag{
    width:38px;
    height:25px;
    object-fit:cover;
    border-radius:4px;
}

.theme-icon{
    width:30px;
    height:30px;
    object-fit:cover;
    border-radius:50%;
}

.theme-photo{
    width:50%;
    height:130px;
    object-fit:cover;
}

/* ECRAN DU JEU */
.game-screen{
    display:none;
    min-height:100vh;
    padding:15px;
    background:#073c2e;
}

.top-game{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.game-back{
    font-size:32px;
    cursor:pointer;
}

.level-box{
    background:#ffd400;
    color:#073c2e;
    padding:9px 15px;
    border-radius:20px;
    font-weight:bold;
}

.coins{
    background:rgba(255,255,255,.15);
    padding:9px 15px;
    border-radius:20px;
}

/* PROGRESSION */
.progress-container{
    background:rgba(255,255,255,.15);
    height:8px;
    border-radius:20px;
    overflow:hidden;
    margin-bottom:20px;
}

.progress{
    height:100%;
    width:0%;
    background:#ffd400;
    transition:.3s;
}

/* TITRE THEME */
.game-theme{
    text-align:center;
    font-size:23px;
    font-weight:bold;
    margin-bottom:15px;
}

/* IMAGES */
.images{
    display:flex;
    gap:10px;
    margin:15px 0;
}

.img-box{
    flex:1;
    background:white;
    padding:5px;
    border-radius:12px;
}

.img-box img{
    width:100%;
    height:145px;
    object-fit:cover;
    border-radius:9px;
}

/* REPONSE */
.slots{
    display:flex;
    justify-content:center;
    gap:7px;
    flex-wrap:wrap;
    margin:20px 0;
}

.slot{
    width:42px;
    height:45px;
    background:rgba(255,255,255,.15);
    border:2px solid rgba(255,255,255,.3);
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    font-weight:bold;
}

/* CLAVIER */
.keys{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:8px;
    margin-top:20px;
}

.key{
    background:#e87b00;
    border:none;
    padding:12px 4px;
    border-radius:9px;
    font-size:18px;
    font-weight:bold;
    color:white;
    cursor:pointer;
}

.key:active{
    transform:scale(.94);
}

.key.used{
    opacity:.25;
}

/* BOUTONS */
.game-buttons{
    display:flex;
    gap:10px;
    margin-top:18px;
}

.action-btn{
    flex:1;
    border:none;
    padding:13px;
    border-radius:12px;
    font-weight:bold;
    cursor:pointer;
}

.delete-btn{
    background:#b93838;
    color:white;
}

.next-btn{
    background:#ffd400;
    color:#073c2e;
    display:none;
}

/* RESPONSIVE */
@media(max-width:420px){

    .logo div{
        width:53px;
        height:53px;
        font-size:31px;
    }

    .main-img{
        width:190px;
        height:190px;
    }

    .theme-info h3{
        font-size:21px;
    }

    .theme-info p{
        font-size:14px;
    }

    .keys{
        grid-template-columns:repeat(5,1fr);
    }

    .img-box img{
        height:125px;
    }
}

    const tabCi = document.getElementById("tab-ci");
    const tabMonde = document.getElementById("tab-monde");

    if(tab === "ci"){

        ci.style.display = "block";
        monde.style.display = "none";

        tabCi.classList.add("active");
        tabMonde.classList.remove("active");

    }else{

        ci.style.display = "none";
        monde.style.display = "block";

        tabCi.classList.remove("active");
        tabMonde.classList.add("active");

    }
}


/* =========================
   DÉMARRER UN THÈME
========================= */

function startGame(theme){

    currentTheme = theme;
    level = 1;

    document.getElementById("home").style.display = "none";
    document.getElementById("game").style.display = "block";

    loadLevel();
}


/* =========================
   CHARGER UN NIVEAU
========================= */

function loadLevel(){

    const levels = allLevels[currentTheme];

    const current = levels[level - 1];

    if(!current){

        alert("🎉 Félicitations ! Tu as terminé tous les niveaux de ce thème.");

        goHome();

        return;
    }


    /* Niveau */

    document.getElementById("lvl").innerText = level;


    /* Pièces */

    document.getElementById("coins").innerText = coins;


    /* Nom thème */

    document.getElementById("gameTheme").innerText =
        themeNames[currentTheme];


    /* Images */

    document.getElementById("img1").src = current.img1;

    document.getElementById("img2").src = current.img2;


    /* Progression */

    const percent =
        ((level - 1) / levels.length) * 100;

    document.getElementById("progress").style.width =
        percent + "%";


    /* Cases */

    const slots =
        document.getElementById("slots");

    slots.innerHTML = "";

    answer = [];

    for(let i = 0; i < current.word.length; i++){

        slots.innerHTML +=
            `<div class="slot"></div>`;

        answer.push("");

    }


    /* Clavier */

    const keys =
        document.getElementById("keys");

    keys.innerHTML = "";

    current.letters
        .split(" ")
        .forEach((letter,index)=>{

            keys.innerHTML += `
                <button
                    class="key"
                    onclick="addLetter('${letter}',this)"
                    data-index="${index}"
                >
                    ${letter}
                </button>
            `;

        });


    /* Bouton suivant */

    document.getElementById("nextBtn").style.display =
        "none";

}


/* =========================
   AJOUTER UNE LETTRE
========================= */

function addLetter(letter,btn){

    const index =
        answer.indexOf("");

    if(index === -1) return;


    answer[index] = letter;

    document.querySelectorAll(".slot")[index]
        .innerText = letter;


    btn.classList.add("used");

    btn.disabled = true;


    /* Vérifier réponse */

    const current =
        allLevels[currentTheme][level - 1];


    if(answer.join("") === current.word){

        coins += 50;

        document.getElementById("coins").innerText =
            coins;

        document.getElementById("progress").style.width =
            ((level / allLevels[currentTheme].length) * 100) + "%";


        document.getElementById("nextBtn").style.display =
            "block";

    }

}


/* =========================
   EFFACER
========================= */

function deleteLetter(){

    let index = -1;

    for(let i = answer.length - 1; i >= 0; i--){

        if(answer[i] !== ""){

            index = i;

            break;

        }

    }

    if(index === -1) return;


    answer[index] = "";

    document.querySelectorAll(".slot")[index]
        .innerText = "";


    const buttons =
        document.querySelectorAll(".key");

    const letter =
        document.querySelectorAll(".slot")[index];


    /* Réactive une lettre correspondante */

    for(const btn of buttons){

        if(
            btn.innerText.trim() ===
            document.querySelectorAll(".slot")[index].innerText
        ){

            btn.classList.remove("used");
            btn.disabled = false;
            break;

        }

    }

    /* Réactive intelligemment la première lettre utilisée */

    const current =
        allLevels[currentTheme][level - 1];

    const usedLetters = {};

    answer.forEach(l=>{

        if(l){
            usedLetters[l] =
                (usedLetters[l] || 0) + 1;
        }

    });

    buttons.forEach(btn=>{

        const l = btn.innerText.trim();

        if(
            usedLetters[l] === undefined ||
            usedLetters[l] === 0
        ){

            btn.classList.remove("used");
            btn.disabled = false;

        }

    });

}


/* =========================
   NIVEAU SUIVANT
========================= */

function nextLevel(){

    const current =
        allLevels[currentTheme][level - 1];


    if(answer.join("") !== current.word){

        return;

    }


    level++;


    if(level > allLevels[currentTheme].length){

        alert(
            "🏆 Bravo ! Tu as terminé tous les niveaux de ce thème !"
        );

        goHome();

        return;

    }


    loadLevel();

}


/* =========================
   RETOUR ACCUEIL
========================= */

function goHome(){

    document.getElementById("game").style.display =
        "none";

    document.getElementById("home").style.display =
        "block";

}

</script>
