<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YA FOY - Jeu de Devinette CI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins', Arial}
body {
  background: linear-gradient(180deg,#0B3D2E,#1A5D4A);
  min-height:100vh; color:#fff; overflow:hidden;
}

/* HEADER */
.top-bar {
  display:flex; justify-content:space-between; align-items:center;
  padding:15px 20px; background:#0B3D2E;
}
.back-btn { font-size:24px; cursor:pointer; }
.title { font-size:18px; font-weight:bold; text-align:center; flex:1; }

/* CHOIX THEME */
.theme-screen { padding:20px; text-align:center; }
.logo-yafoy { font-size:40px; font-weight:900; color:#FFD700; margin:10px 0; }
.logo-yafoy span { background:#FFD700; color:#0B3D2E; padding:5px 8px; border-radius:8px; margin:0 2px; }
.tabs { display:flex; gap:10px; margin:20px 0; }
.tab { flex:1; padding:12px; background:#0B3D2E; border-radius:12px 12px 0 0; font-weight:bold; cursor:pointer; }
.tab.active { background:#FFD700; color:#0B3D2E; }
.theme-card {
  background:#F5E6C8; color:#333; border-radius:15px; margin:12px 0; padding:15px;
  display:flex; align-items:center; gap:15px; cursor:pointer; transition:0.2s;
}
.theme-card:hover { transform:scale(1.02); }
.theme-card h3 { color:#E67E00; font-size:20px; }
.theme-card img { width:80px; height:80px; border-radius:10px; object-fit:cover; margin-left:auto; }
.flag { width:30px; height:20px; border-radius:3px; }

/* ECRAN JEU */
.game-screen { display:none; padding:15px; }
.header-game {
  display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;
}
.level { font-weight:bold; }
.coins { background:rgba(255,255,255,0.2); padding:8px 15px; border-radius:20px; display:flex; align-items:center; gap:5px; }
.coin { width:20px; height:20px; background:gold; border-radius:50%; }

.images { display:flex; gap:10px; margin:15px 0; }
.img-box { flex:1; background:#fff; padding:5px; border-radius:10px; }
.img-box img { width:100%; height:120px; object-fit:cover; border-radius:8px; }

.controls { display:flex; justify-content:center; gap:20px; margin:15px 0; }
.ctrl-btn { width:45px; height:45px; background:rgba(255,255,255,0.2); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:20px; cursor:pointer; }

.answer-slots { display:flex; justify-content:center; gap:8px; margin:20px 0; }
.slot { width:45px; height:45px; background:rgba(255,255,255,0.2); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:bold; }

.keyboard { display:grid; grid-template-columns:repeat(6,1fr); gap:8px; padding:0 10px; }
.key { background:#E67E00; color:#fff; border:none; padding:12px; border-radius:8px; font-size:18px; font-weight:bold; cursor:pointer; }
.key.used { opacity:0.3; }

.popup-lock {
  position:fixed; top:0; left:0; width:100%; height:100%;
  background:rgba(0,0,0,0.8); display:none; align-items:center; justify-content:center;
}
.lock-box { background:#F5E6C8; color:#333; padding:30px; border-radius:20px; text-align:center; max-width:350px; }
.lock-box h2 { color:#E67E00; margin:10px 0; }
</style>
</head>
<body>

<!-- ECRAN CHOIX THEME -->
<div class="theme-screen" id="themeScreen">
  <div class="back-btn">←</div>
  <h2>Choisissez un thème pour commencer</h2>
  <div class="logo-yafoy"><span>Y</span><span>A</span> <span>F</span><span>O</span><span>Y</span></div>
  <img src="https://i.imgur.com/8Km9tLL.png" style="width:200px"> <!-- Elephant + Avion + Fille -->

  <div class="tabs">
    <div class="tab active" onclick="switchTab('ci')">Cote d'Ivoire</div>
    <div class="tab" onclick="switchTab('monde')">Monde</div>
  </div>

  <div id="ciThemes">
    <div class="theme-card" onclick="startGame('Classique')">
      <div>
        <h3>Classique</h3>
        <p>Culture et Argot</p>
        <img src="https://flagcdn.com/ci.svg" class="flag">
      </div>
      <img src="https://upload.wikimedia.org/wikipedia/commons/7/7d/Basilique_Notre-Dame_de_la_Paix_de_Yamoussoukro.jpg">
    </div>
    <div class="theme-card" onclick="showLock('CAN 2023', 500)">
      <div>
        <h3>CAN 2023</h3>
        <p>Retour sur la CAN</p>
        <img src="https://flagcdn.com/ci.svg" class="flag">
      </div>
      <img src="https://images.unsplash.com/photo-1577223625816-7546f13ea8e7?q=80&w=200">
    </div>
    <div class="theme-card" onclick="startGame('Musique')">
      <div>
        <h3>Musique</h3>
        <p>Culture Musicale</p>
        <img src="https://flagcdn.com/ci.svg" class="flag">
      </div>
      <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?q=80&w=200">
    </div>
  </div>

  <div id="mondeThemes" style="display:none">
    <div class="theme-card" onclick="startGame('Classique Monde')">
      <div>
        <h3>Classique</h3>
        <p>Culture générale</p>
        <img src="https://flagcdn.com/w20/us.png" class="flag">
      </div>
      <img src="https://images.unsplash.com/photo-1502602898657-3e91760cbb34?q=80&w=200">
    </div>
    <div class="theme-card" onclick="startGame('Drapeaux')">
      <div>
        <h3>Drapeaux</h3>
        <p>Trouve le pays</p>
        <img src="https://flagcdn.com/w20/us.png" class="flag">
      </div>
      <img src="https://flagcdn.com/ca.svg" style="height:60px">
    </div>
  </div>
</div>

<!-- ECRAN JEU -->
<div class="game-screen" id="gameScreen">
  <div class="header-game">
    <div class="level">Niveau<br><span id="level">1</span></div>
    <div class="coins"><div class="coin"></div><span id="coins">250</span></div>
    <div class="back-btn" onclick="goHome()">🏠</div>
  </div>

  <div class="images">
    <div class="img-box"><img id="img1" src=""></div>
    <div class="img-box"><img id="img2" src=""></div>
  </div>

  <div class="controls">
    <div class="ctrl-btn" onclick="undo()">↩️</div>
    <div class="ctrl-btn" onclick="hint()">?</div>
    <div class="ctrl-btn" onclick="shuffle()">🔄</div>
  </div>

  <div class="answer-slots" id="slots"></div>
  <div class="keyboard" id="keyboard"></div>
</div>

<!-- POPUP DEBLOQUER -->
<div class="popup-lock" id="lockPopup">
  <div class="lock-box">
    <div style="font-size:50px">🔒</div>
    <h2 id="lockTitle"></h2>
    <img id="lockImg" style="width:100%; border-radius:10px; margin:10px 0;">
    <p>Pour débloquer ce thème, il vous faut:</p>
    <div style="background:#fff; padding:10px; border-radius:20px; margin:10px 0; display:flex; align-items:center; justify-content:center; gap:10px;">
      <b id="lockPrice"></b> <div class="coin"></div>
    </div>
    <button onclick="closeLock()" style="background:#E67E00; color:#fff; border:none; padding:10px 30px; border-radius:10px; font-weight:bold;">Retour</button>
  </div>
</div>

<script>
let coins = 250;
let level = 1;
let currentWord = "HOTEL";
let answer = [];

const levels = [
  {word:"HOTEL", img1:"https://images.unsplash.com/photo-1566073771259-6a8506099945?q=80&w=400", img2:"https://images.unsplash.com/photo-1551836022-deb4988cc6c0?q=80&w=400", letters:"C V X R H O B I P I B E"},
  {word:"ELEPHANT", img1:"https://images.unsplash.com/photo-1557050543-4d5f4e07ef46?q=80&w=400", img2:"https://images.unsplash.com/photo-1557050543-4d5f4e07ef46?q=80&w=400", letters:"E L E P H A N T X Q Z"},
  {word:"ABIDJAN", img1:"https://images.unsplash.com/photo-1524661135-423995f22d0b?q=80&w=400", img2:"https://images.unsplash.com/photo-1524661135-423995f22d0b?q=80&w=400", letters:"A B I D J A N C F G"}
];

function switchTab(tab){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('ciThemes').style.display = tab==='ci'?'block':'none';
  document.getElementById('mondeThemes').style.display = tab==='monde'?'block':'none';
}

function showLock(name, price){
  document.getElementById('lockPopup').style.display = 'flex';
  document.getElementById('lockTitle').innerText = name;
  document.getElementById('lockPrice').innerText = price;
  document.getElementById('lockImg').src = "https://images.unsplash.com/photo-1577223625816-7546f13ea8e7?q=80&w=400";
}
function closeLock(){ document.getElementById('lockPopup').style.display = 'none'; }

function startGame(theme){
  document.getElementById('themeScreen').style.display = 'none';
  document.getElementById('gameScreen').style.display = 'block';
  loadLevel();
}

function loadLevel(){
  const lvl = levels[(level-1) % levels.length];
  currentWord = lvl.word;
  document.getElementById('img1').src = lvl.img1;
  document.getElementById('img2').src = lvl.img2;
  document.getElementById('level').innerText = level;

  // Créer les slots
  const slots = document.getElementById('slots');
  slots.innerHTML = '';
  answer = [];
  for(let i=0; i<currentWord.length; i++){
    const slot = document.createElement('div');
    slot.className = 'slot';
    slot.dataset.index = i;
    slots.appendChild(slot);
    answer.push('');
  }

  // Créer clavier
  const keyboard = document.getElementById('keyboard');
  keyboard.innerHTML = '';
  lvl.letters.split(' ').forEach(letter=>{
    const btn = document.createElement('button');
    btn.className = 'key';
    btn.innerText = letter;
    btn.onclick = () => addLetter(letter, btn);
    keyboard.appendChild(btn);
  });
}

function addLetter(letter, btn){
  const emptyIndex = answer.indexOf('');
  if(emptyIndex!== -1){
    answer[emptyIndex] = letter;
    document.querySelectorAll('.slot')[emptyIndex].innerText = letter;
    btn.classList.add('used');
    checkWin();
  }
}

function checkWin(){
  if(!answer.includes('') && answer.join('') === currentWord){
    coins += 50;
    document.getElementById('coins').innerText = coins;
    alert('Bravo! +50 pièces');
    level++;
    setTimeout(loadLevel, 1000);
  }
}

function undo(){
  const lastIndex = answer.lastIndexOf(answer.filter(l=>l!=='').pop());
  if(lastIndex!== -1){
    answer[lastIndex] = '';
    document.querySelectorAll('.slot')[lastIndex].innerText = '';
    document.querySelectorAll('.key.used')[document.querySelectorAll('.key.used').length-1].classList.remove('used');
  }
}
function hint(){ alert("Indice: Le mot a " + currentWord.length + " lettres"); }
function shuffle(){ loadLevel(); }
function goHome(){
  document.getElementById('gameScreen').style.display = 'none';
  document.getElementById('themeScreen').style.display = 'block';
}
</script>
</body>
</html>
