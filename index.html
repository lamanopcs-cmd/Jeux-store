<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YA FOY CI - Jeu Devinette</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Arial'}
body { background:#0B3D2E; color:#fff; }
.header { text-align:center; padding:15px; }
.header h2 { font-size:18px; margin-bottom:10px; }
.logo { display:flex; justify-content:center; gap:5px; margin:10px 0; }
.logo div { background:#FFD700; color:#0B3D2E; font-size:28px; font-weight:900; padding:5px 12px; border-radius:8px; }
.main-img { width:200px; height:200px; border-radius:20px; object-fit:cover; margin:10px auto; border:4px solid #FFD700; }

.tabs { display:flex; margin:20px; gap:10px; }
.tab { flex:1; padding:12px; background:#0F4F3A; border-radius:12px; text-align:center; font-weight:bold; cursor:pointer; }
.tab.active { background:#FFD700; color:#0B3D2E; }

.theme-list { padding:0 15px; }
.theme-card {
  background:#F5E6C8; color:#333; border-radius:15px; margin:12px 0; padding:15px;
  display:flex; align-items:center; gap:15px; cursor:pointer;
}
.theme-card h3 { color:#E67E00; font-size:20px; }
.theme-card p { font-size:14px; }
.theme-card img { width:70px; height:70px; border-radius:10px; object-fit:cover; margin-left:auto; }
.flag { width:35px; height:25px; border-radius:4px; }

/* ECRAN JEU */
.game-screen { display:none; padding:15px; }
.top-game { display:flex; justify-content:space-between; align-items:center; }
.coins { background:rgba(255,255,255,0.2); padding:8px 15px; border-radius:20px; }
.images { display:flex; gap:10px; margin:15px 0; }
.img-box { flex:1; background:#fff; padding:5px; border-radius:10px; }
.img-box img { width:100%; height:130px; object-fit:cover; border-radius:8px; }
.slots { display:flex; justify-content:center; gap:8px; margin:20px 0; }
.slot { width:40px; height:40px; background:rgba(255,255,255,0.2); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:bold; }
.keys { display:grid; grid-template-columns:repeat(6,1fr); gap:8px; }
.key { background:#E67E00; border:none; padding:12px; border-radius:8px; font-size:18px; font-weight:bold; color:#fff; cursor:pointer; }
</style>
</head>
<body>

<!-- ECRAN ACCUEIL -->
<div id="home">
  <div class="header">
    <div>←</div>
    <h2>Choisissez un thème pour commencer</h2>
    <div class="logo"><div>Y</div><div>A</div><div>F</div><div>O</div><div>Y</div></div>
    <img src="/mnt/data/wa_image_2719975707242398077_3" class="main-img"> <!-- TA PHOTO -->
  </div>

  <div class="tabs">
    <div class="tab active" onclick="showTab('ci')">Cote d'Ivoire</div>
    <div class="tab" onclick="showTab('monde')">Monde</div>
  </div>

  <div class="theme-list" id="ci">
    <div class="theme-card" onclick="startGame('ci-classique')">
      <div>
        <h3>Classique</h3>
        <p>Culture et Argot</p>
        <img src="https://flagcdn.com/ci.svg" class="flag">
      </div>
      <img src="https://upload.wikimedia.org/wikipedia/commons/7/7d/Basilique_Notre-Dame_de_la_Paix_de_Yamoussoukro.jpg">
    </div>
    <div class="theme-card" onclick="startGame('ci-can')">
      <div>
        <h3>CAN 2023</h3>
        <p>Retour sur la CAN</p>
        <img src="https://flagcdn.com/ci.svg" class="flag">
      </div>
      <img src="https://images.unsplash.com/photo-1577223625816-7546f13ea8e7?q=80&w=200">
    </div>
    <div class="theme-card" onclick="startGame('ci-musique')">
      <div>
        <h3>Musique</h3>
        <p>Culture Musicale</p>
        <img src="https://flagcdn.com/ci.svg" class="flag">
      </div>
      <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?q=80&w=200">
    </div>
  </div>

  <div class="theme-list" id="monde" style="display:none">
    <div class="theme-card" onclick="startGame('monde-classique')">
      <div>
        <h3>Classique</h3>
        <p>Culture générale</p>
        <img src="https://flagcdn.com/w20/us.png" class="flag">
      </div>
      <img src="https://images.unsplash.com/photo-1502602898657-3e91760cbb34?q=80&w=200">
    </div>
    <div class="theme-card" onclick="startGame('monde-drapeaux')">
      <div>
        <h3>Drapeaux</h3>
        <p>Trouve le pays</p>
        <img src="https://flagcdn.com/w20/us.png" class="flag">
      </div>
      <img src="https://flagcdn.com/ca.svg" style="height:50px">
    </div>
  </div>
</div>

<!-- ECRAN JEU -->
<div class="game-screen" id="game">
  <div class="top-game">
    <div onclick="goHome()">←</div>
    <div>Niveau <span id="lvl">1</span></div>
    <div class="coins">🪙 <span id="coins">250</span></div>
  </div>

  <div class="images">
    <div class="img-box"><img id="img1"></div>
    <div class="img-box"><img id="img2"></div>
  </div>

  <div class="slots" id="slots"></div>
  <div class="keys" id="keys"></div>
</div>

<script>
let coins = 250;
let level = 1;
let currentTheme = '';
let answer = [];

const allLevels = {
  'ci-classique': [
    {word:"HOTEL", img1:"https://images.unsplash.com/photo-1566073771259-6a8506099945?q=80&w=400", img2:"https://images.unsplash.com/photo-1551836022-deb4988cc6c0?q=80&w=400", letters:"H O T E L C V X"},
    {word:"ABIDJAN", img1:"https://images.unsplash.com/photo-1524661135-423995f22d0b?q=80&w=400", img2:"https://images.unsplash.com/photo-1524661135-423995f22d0b?q=80&w=400", letters:"A B I D J A N C"}
  ],
  'ci-can': [
    {word:"FOOT", img1:"https://images.unsplash.com/photo-1577223625816-7546f13ea8e7?q=80&w=400", img2:"https://images.unsplash.com/photo-1577223625816-7546f13ea8e7?q=80&w=400", letters:"F O O T B A L L"},
    {word:"STADE", img1:"https://images.unsplash.com/photo-1552667466-07770ae11077?q=80&w=400", img2:"https://images.unsplash.com/photo-1552667466-07770ae11077?q=80&w=400", letters:"S T A D E P I L E"}
  ],
  'ci-musique': [
    {word:"ZOUGOU", img1:"https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?q=80&w=400", img2:"https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?q=80&w=400", letters:"Z O U G O U M U S"},
    {word:"COUPE", img1:"https://images.unsplash.com/photo-1514320291840-2e0a9bf2a9ae?q=80&w=400", img2:"https://images.unsplash.com/photo-1514320291840-2e0a9bf2a9ae?q=80&w=400", letters:"C O U P E D E C A"}
  ],
  'monde-classique': [
    {word:"PARIS", img1:"https://images.unsplash.com/photo-1502602898657-3e91760cbb34?q=80&w=400", img2:"https://images.unsplash.com/photo-1502602898657-3e91760cbb34?q=80&w=400", letters:"P A R I S T O U R"},
    {word:"TOUR", img1:"https://images.unsplash.com/photo-1502602898657-3e91760cbb34?q=80&w=400", img2:"https://images.unsplash.com/photo-1502602898657-3e91760cbb34?q=80&w=400", letters:"T O U R E I F F E"}
  ],
  'monde-drapeaux': [
    {word:"CANADA", img1:"https://flagcdn.com/ca.svg", img2:"https://flagcdn.com/ca.svg", letters:"C A N A D A B C"},
    {word:"FRANCE", img1:"https://flagcdn.com/fr.svg", img2:"https://flagcdn.com/fr.svg", letters:"F R A N C E G H"}
  ]
};

function showTab(tab){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('ci').style.display = tab==='ci'?'block':'none';
  document.getElementById('monde').style.display = tab==='monde'?'block':'none';
}

function startGame(theme){
  currentTheme = theme;
  level = 1;
  document.getElementById('home').style.display = 'none';
  document.getElementById('game').style.display = 'block';
  loadLevel();
}

function loadLevel(){
  const lvl = allLevels[currentTheme][(level-1) % allLevels[currentTheme].length];
  document.getElementById('lvl').innerText = level;
  document.getElementById('img1').src = lvl.img1;
  document.getElementById('img2').src = lvl.img2;

  // Slots
  const slots = document.getElementById('slots');
  slots.innerHTML = '';
  answer = [];
  for(let i=0; i<lvl.word.length; i++){
    slots.innerHTML += `<div class="slot"></div>`;
    answer.push('');
  }

  // Clavier
  const keys = document.getElementById('keys');
  keys.innerHTML = '';
  lvl.letters.split(' ').forEach(l=>{
    keys.innerHTML += `<button class="key" onclick="addLetter('${l}',this)">${l}</button>`;
  });
}

function addLetter(l, btn){
  const i = answer.indexOf('');
  if(i!==-1){
    answer[i]=l;
    document.querySelectorAll('.slot')[i].innerText=l;
    btn.style.opacity=0.3;
    if(answer.join('') === allLevels[currentTheme][(level-1)%allLevels[currentTheme].length].word){
      coins+=50;
      document.getElementById('coins').innerText=coins;
      alert('Bravo! +50 pièces');
      level++;
      setTimeout(loadLevel,800);
    }
  }
}

function goHome(){
  document.getElementById('game').style.display = 'none';
  document.getElementById('home').style.display = 'block';
}
</script>
</body>
</html>
