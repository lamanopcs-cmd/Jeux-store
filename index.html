<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LA MÉLO — RUN & GUN</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0f0a;color:#e8e8e8;font-family:"Segoe UI",Arial,sans-serif;
       display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:8px}
  #wrap{position:relative;width:min(900px,96vw);box-shadow:0 0 40px rgba(60,160,60,.3)}
  canvas{width:100%;display:block;background:#000;border:2px solid #3a5a3a;border-radius:10px}
  #hint{font-size:13px;color:#7CFC00;letter-spacing:1px;text-align:center}
  #hint b{color:#ffd700}
  #ov{position:absolute;inset:0;background:rgba(0,0,0,.82);display:none;flex-direction:column;
       align-items:center;justify-content:center;text-align:center;border-radius:10px;z-index:10;padding:20px}
  #ov h1{font-size:44px;color:#7CFC00;text-shadow:0 0 25px #32CD32;letter-spacing:4px;margin-bottom:6px}
  #ov h2{color:#ffd700;margin:8px 0;letter-spacing:2px}
  #ov p{color:#ccc;margin:4px 0;font-size:15px}
  #ov .stat{color:#ffd700;font-size:18px;margin:10px 0}
  #ov button{margin-top:18px;padding:14px 40px;font-size:17px;font-weight:bold;cursor:pointer;
       background:linear-gradient(180deg,#9ACD32,#556B2F);color:#0a0f0a;border:none;border-radius:10px;letter-spacing:1px}
  #ov button:hover{filter:brightness(1.2)}
  #ov .small{font-size:12px;color:#888;margin-top:10px}
  .k{color:#ff6b6b}.g{color:#7CFC00}.y{color:#ffd700}.c{color:#87CEEB}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="900" height="500"></canvas>
  <div id="ov">
    <h1 id="ov-title">LA MÉLO</h1>
    <div id="ov-body"></div>
  </div>
</div>
<div id="hint"><b>ESPACE / ↑</b> sauter &nbsp;•&nbsp; <b>X ou CLIC SOURIS</b> tirer &nbsp;•&nbsp; le soldat court tout seul</div>

<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const OV=document.getElementById('ov'),OVT=document.getElementById('ov-title'),OVB=document.getElementById('ov-body');
const W=cv.width,H=cv.height,GROUND=400;
const G={state:'menu',level:1,maxLevel:10,dist:0,target:1400,kills:0,score:0,spawnT:0,boss:false,bossHp:0,bossMax:0,over:0,freeze:0};
let P={x:120,y:GROUND-52,vy:0,w:34,h:52,hp:100,maxHp:100,fireCd:0,inv:0,onGround:true};
let enemies=[],pBullets=[],eBullets=[],parts=[],picks=[];
let firing=false,keys={};

function pw(){return G.dist+P.x}                 // position monde du joueur
function resetPlayer(){P.hp=P.maxHp=100;P.y=GROUND-52;P.vy=0;P.inv=0}
function newGame(){G.state='play';G.level=1;G.dist=0;G.target=1400;G.kills=0;G.score=0;G.boss=false;G.spawnT=0;
  enemies=[];pBullets=[];eBullets=[];parts=[];picks=[];resetPlayer();OV.style.display='none';}

/* ---------- ENNEMIS ---------- */
function spawnEnemy(){
  const lv=G.level;
  const t=Math.random();
  let e={x:pw()+W+80+Math.random()*160,y:GROUND-46,w:30,h:46,hp:0,maxHp:0,dmg:0,shootT:0,type:'g',boss:false,walk:0};
  if(G.boss)return;
  if(t<0.55){e.type='g';e.hp=e.maxHp=22+lv*6;e.dmg=7+lv*1.5;e.shootT=1+Math.random()*0.8;e.speed=0.7;}
  else if(t<0.85){e.type='s';e.hp=e.maxHp=16+lv*5;e.dmg=6+lv*1.2;e.shootT=0.8+Math.random()*0.5;e.speed=0;}
  else{e.type='h';e.hp=e.maxHp=55+lv*14;e.dmg=10+lv*1.8;e.shootT=1.6+Math.random()*0.6;e.speed=0.35;e.w=42;e.h=56;e.y=GROUND-56;}
  enemies.push(e);
}
function spawnBoss(){
  G.boss=true;G.bossMax=G.bossHp=650+G.level*80;G.freeze=0;
  enemies.push({x:pw()+760,y:GROUND-62,w:52,h:62,hp:650+G.level*80,maxHp:650+G.level*80,
    dmg:12+G.level*1.5,shootT:0.8,type:'boss',speed:1.1,boss:true,phase:1});
}

/* ---------- TIRS ---------- */
function fire(){
  if(P.fireCd>0)return;
  P.fireCd=0.12;
  pBullets.push({x:pw()+30,y:P.y+10,vx:14,vy:0});
  for(let i=0;i<3;i++)parts.push({x:pw()+34,y:P.y+12,vx:3+Math.random()*2,vy:-1+Math.random()*2-1,l:6,c:'#ffd700'});
  G.score+=1;
}
function enemyFire(e){
  const dx=pw()-e.x,dy=(P.y+20)-(e.y+18),d=Math.hypot(dx,dy)||1;
  const sp=3+Math.min(2.5,G.level*0.15);
  eBullets.push({x:e.x+e.w/2,y:e.y+18,vx:dx/d*sp,vy:dy/d*sp});
  parts.push({x:e.x+e.w/2,y:e.y+16,vx:-2,vy:0,l:5,c:'#ff5555'});
}

/* ---------- UPDATE ---------- */
function update(dt){
  if(G.state!=='play')return;
  G.over+=dt;
  if(G.boss){G.dist+=2.2;}else{G.dist+=3+Math.min(4,G.level*0.15);}   // course auto
  P.fireCd-=dt;if(P.inv>0)P.inv-=dt;
  // saut
  if((keys[' ']||keys['ArrowUp']||keys['w']||keys['W'])&&P.onGround){P.vy=-12.5;P.onGround=false;}
  P.vy+=0.55;P.y+=P.vy;
  if(P.y>=GROUND-P.h){P.y=GROUND-P.h;P.vy=0;P.onGround=true;}
  if(firing)fire();

  // progression de niveau
  if(!G.boss&&G.dist>=G.target){
    if(G.level<G.maxLevel){levelUp();}
    else{spawnBoss();logBoss();}
  }
  // spawn
  G.spawnT-=dt;
  if(!G.boss&&G.spawnT<=0){spawnEnemy();G.spawnT=Math.max(0.7,1.5-G.level*0.07)*(0.7+Math.random()*0.6);}

  // balles joueur
  for(let i=pBullets.length-1;i>=0;i--){
    const b=pBullets[i];b.x+=b.vx;b.y+=b.vy;
    if(b.x>pw()+W+100){pBullets.splice(i,1);continue;}
    let hit=false;
    for(const e of enemies){
      if(b.x>e.x&&b.x<e.x+e.w&&b.y>e.y&&b.y<e.y+e.h){e.hp-=12+G.level*2;hit=true;G.score+=5;
        for(let k=0;k<4;k++)parts.push({x:b.x,y:b.y,vx:(Math.random()-0.5)*4,vy:-2-Math.random()*3,l:7,c:'#ff4444'});
        if(e.hp<=0){killEnemy(e);}break;}
    }
    if(hit)pBullets.splice(i,1);
  }
  // balles ennemies
  for(let i=eBullets.length-1;i>=0;i--){
    const b=eBullets[i];b.x+=b.vx;b.y+=b.vy;
    if(b.x<pw()-200||b.x>pw()+W+200||b.y>H+50||b.y<-50){eBullets.splice(i,1);continue;}
    if(P.inv<=0&&b.x>pw()-8&&b.x<pw()+P.w+8&&b.y>P.y&&b.y<P.y+P.h){hitPlayer(b.vx>0?1:-1);eBullets.splice(i,1);}
  }
  // ennemis
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    if(e.type==='boss'){
      const tx=pw()+300;
      if(e.x>tx)e.x-=e.speed;else if(e.x<tx)e.x+=e.speed;
      e.shootT-=dt;
      if(e.shootT<=0){e.shootT=Math.max(0.45,1.1-G.bossHp/G.bossMax*0.5);
        enemyFire(e);if(G.bossHp<G.bossMax*0.5)enemyFire(e);}  // phase 2 : double tir
      if(P.inv<=0&&Math.abs(pw()-e.x)<55&&Math.abs(P.y+20-(e.y+30))<45){hitPlayer(1);}
    }else{
      e.x-=e.speed;e.shootT-=dt;
      if(e.shootT<=0&&Math.abs(pw()-e.x)<520&&e.x>pw()+30){enemyFire(e);e.shootT=1.3+Math.random()*0.9;}
      if(e.x<pw()-80){enemies.splice(i,1);continue;}
      if(P.inv<=0&&Math.abs(pw()-e.x)<e.w-6&&Math.abs(P.y+20-(e.y+20))<40){hitPlayer(1);enemies.splice(i,1);}
    }
  }
  // particules & soins
  parts=parts.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.l-=dt;return p.l>0});
  for(let i=picks.length-1;i>=0;i--){
    const k=picks[i];k.y=Math.min(GROUND-18,k.y+2);
    if(Math.abs(pw()-k.x)<30&&Math.abs(P.y+20-k.y)<40){P.hp=Math.min(P.maxHp,P.hp+25);k.taken=true;
      logMsg('+25 PV (trousse)','g');}
    if(k.taken)picks.splice(i,1);
  }
  if(P.hp<=0){gameOver();}
}
function killEnemy(e){
  G.kills++;G.score+=50+10*G.level;
  if(Math.random()<0.12)picks.push({x:e.x+e.w/2,y:e.y,type:'med',taken:false});
  if(e.type==='boss'){victory();return;}
  enemies.splice(enemies.indexOf(e),1);
}
function hitPlayer(dir){
  if(G.boss)P.hp-=10+G.level*1.2;else P.hp-=7+G.level*1.2;
  P.inv=0.8;P.x=Math.max(20,P.x-dir*6);
  for(let i=0;i<8;i++)parts.push({x:pw()+20,y:P.y+20,vx:(Math.random()-0.5)*6,vy:-3-Math.random()*3,l:9,c:'#ff4444'});
}
function levelUp(){
  G.level++;
  G.dist=0;G.target=1400+G.level*220;
  enemies=[];eBullets=[];
  P.hp=Math.min(P.maxHp,P.hp+30);
  G.freeze=1.6;G.state='levelup';
  OVT.innerHTML='NIVEAU '+G.level;
  OVB.innerHTML=`<p class="g">Zone sécurisée — progression vers le QG du Chef Bandit.</p>
    <p class="c">OBJECTIF : parcourir ${G.target} m</p><p class="y">+30 PV</p>`;
  OV.style.display='flex';
  setTimeout(()=>{if(G.state==='levelup'){G.state='play';OV.style.display='none';}},1600);
}
function logBoss(){
  G.state='levelup';G.freeze=1.8;
  OVT.innerHTML='☠ ALERTE BOSS ☠';
  OVB.innerHTML=`<p class="k">LE CHEF BANDIT est là ! Il défend son QG.</p><p>Il tire par rafales et devient plus rapide en phase 2.</p>`;
  OV.style.display='flex';
  setTimeout(()=>{if(G.state==='levelup'){G.state='play';OV.style.display='none';}},1800);
}
function victory(){
  G.state='victory';
  OVT.innerHTML='🏆 MISSION ACCOMPLIE 🏆';
  OVB.innerHTML=`<p class="g">Tu as éliminé <b>LE CHEF BANDIT</b> et libéré la zone !</p>
    <div class="stat">Éliminations : ${G.kills} &nbsp;•&nbsp; Score : ${G.score}</div>
    <p class="y">LEGEND OF LA MÉLO</p>
    <button onclick="newGame()">🔄 REJOUER</button><p class="small">La MÉLO se souviendra de toi, soldat.</p>`;
  OV.style.display='flex';
}
function gameOver(){
  G.state='gameover';
  OVT.innerHTML='💀 TU ES TOMBÉ 💀';
  OVB.innerHTML=`<p class="k">Tu es mort au niveau ${G.level}, à ${Math.round(G.dist)}m de l'objectif.</p>
    <div class="stat">Éliminations : ${G.kills} &nbsp;•&nbsp; Score : ${G.score}</div>
    <button onclick="newGame()">🪖 NOUVELLE PARTIE</button>`;
  OV.style.display='flex';
}

/* ---------- RENDU ---------- */
function rnd(seed){let s=seed%10000;return function(){s=(s*9301+49297)%233280;return s/233280}}
const skyR=rnd(7),bldR=rnd(13),crateR=rnd(29);
function draw(){
  // ciel
  const grd=ctx.createLinearGradient(0,0,0,H);
  grd.addColorStop(0,'#0c1a30');grd.addColorStop(0.6,'#22445c');grd.addColorStop(1,'#3a2a1a');
  ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,240,180,.9)';ctx.beginPath();ctx.arc(W-120,60,22,0,7);ctx.fill();
  // immeubles lointains (parallaxe)
  ctx.fillStyle='#16283a';
  for(let i=0;i<14;i++){const x=((i*160-G.dist*0.3)%(W+320)+W+320)%(W+320)-160;
    ctx.fillRect(x,GROUND-90-skyR(i)*70,90,120);}
  // décors au sol
  ctx.fillStyle='#1e2a1e';
  for(let i=0;i<12;i++){const x=((i*220-G.dist*0.8)%(W+400)+W+400)%(W+400)-200;
    ctx.fillRect(x,GROUND-14,26,18);}
  // caisses
  ctx.fillStyle='#6b4a2a';
  for(let i=0;i<6;i++){const x=((i*330-G.dist)%(W+300)+W+300)%(W+300)-150;
    ctx.fillRect(x,GROUND-24,34,26);ctx.strokeStyle='#3a2410';ctx.strokeRect(x,GROUND-24,34,26);}
  // sol
  ctx.fillStyle='#3a3a2a';ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.strokeStyle='#2a2a1e';ctx.beginPath();
  for(let x=-(G.dist%40);x<W;x+=40){ctx.moveTo(x,GROUND);ctx.lineTo(x,H);}ctx.stroke();

  // soins au sol
  for(const k of picks){ctx.fillStyle='#fff';ctx.fillRect(k.x-G.dist-9,k.y-8,18,16);
    ctx.fillStyle='#ff0000';ctx.fillRect(k.x-G.dist-6,k.y-5,12,10);ctx.fillStyle='#fff';
    ctx.fillRect(k.x-G.dist-3,k.y-2,6,4);}
  // ennemis
  for(const e of enemies){
    const sx=e.x-G.dist;
    if(e.type==='boss'){
      ctx.fillStyle='#3a0000';ctx.fillRect(sx-6,e.y-8,e.w+12,e.h+10);
      ctx.fillStyle='#8b1a1a';ctx.fillRect(sx,e.y,e.w,e.h);
      ctx.fillStyle='#ffd700';ctx.fillRect(sx+4,e.y+4,10,10);              // bandana
      ctx.fillStyle='#e8e8e8';ctx.fillRect(sx+8,e.y+14,8,6);
      ctx.fillStyle='#222';ctx.fillRect(sx+e.w-4,e.y+18,10,26);ctx.fillStyle='#555';ctx.fillRect(sx+e.w-4,e.y+18,4,26);
      ctx.fillStyle='#ff6b6b';
      ctx.fillRect(sx+4,e.y-16,e.w-8,6);
      ctx.fillStyle='#900';ctx.fillRect(sx+4,e.y-16,(e.w-8)*(e.hp/e.maxHp),6);
    }else{
      ctx.fillStyle=e.type==='h'?'#3a3a5a':(e.type==='s'?'#2a4a2a':'#4a3a2a');
      ctx.fillRect(sx,e.y,e.w,e.h);
      ctx.fillStyle='#555';ctx.fillRect(sx+e.w/2-4,e.y-16,8,16);
      ctx.fillStyle='#e8e8e8';ctx.fillRect(sx+e.w/2-3,e.y-13,6,5);
      ctx.fillStyle='#111';ctx.fillRect(sx+e.w-6,e.y+14,10,20);ctx.fillStyle='#333';ctx.fillRect(sx+e.w-6,e.y+14,4,20);
      ctx.fillStyle='#7a3a3a';ctx.fillRect(sx+6,e.y-5,e.w-12,4);
    }
  }
  // joueur
  const jx=P.x;
  ctx.fillStyle=P.inv>0&&Math.floor(G.over*20)%2===0?'rgba(255,255,255,.35)':'#1a4a1a';
  ctx.fillRect(jx-4,P.y-6,P.w+8,P.h+8);
  ctx.fillStyle='#2a6a2a';ctx.fillRect(jx,P.y,P.w,P.h);
  ctx.fillStyle='#1a3a1a';ctx.fillRect(jx+6,P.y+22,8,8);
  ctx.fillStyle='#3a8a3a';ctx.fillRect(jx+8,P.y-12,P.w-4,12);              // casque
  ctx.fillStyle='#0a1a0a';ctx.fillRect(jx+2,P.y+26,8,12);
  ctx.fillStyle='#222';ctx.fillRect(jx+P.w-6,P.y+12,16,8);ctx.fillStyle='#444';ctx.fillRect(jx+P.w-6,P.y+12,5,8);
  // flash bouche
  if(P.fireCd>0.09)ctx.fillStyle='#ffd700';else ctx.fillStyle='#cc8800';
  ctx.fillRect(jx+P.w+8,P.y+13,8,4);
  // balles
  ctx.fillStyle='#ffd700';for(const b of pBullets){ctx.fillRect(b.x-G.dist-5,b.y-2,10,4);ctx.fillRect(b.x-G.dist-9,b.y-2,3,2);}
  ctx.fillStyle='#ff5555';for(const b of eBullets){ctx.beginPath();ctx.arc(b.x-G.dist,b.y,4,0,7);ctx.fill();
    ctx.fillStyle='rgba(255,80,80,.5)';ctx.beginPath();ctx.arc(b.x-G.dist,b.y,7,0,7);ctx.fill();ctx.fillStyle='#ff5555';}
  // particules
  for(const p of parts){ctx.globalAlpha=Math.min(1,p.l);ctx.fillStyle=p.c;ctx.fillRect(p.x-G.dist-2,p.y-2,4,4);}
  ctx.globalAlpha=1;

  // HUD
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(8,8,250,86);
  ctx.fillStyle='#7CFC00';ctx.font='bold 13px Arial';
  ctx.fillText('NIVEAU '+G.level+'/10',16,26);
  ctx.fillStyle='#ccc';ctx.font='11px Arial';
  ctx.fillText('OBJECTIF : '+(G.boss?'ÉLIMINER LE CHEF BANDIT':Math.max(0,Math.round(G.target-G.dist))+' m restants'),16,42);
  ctx.fillStyle='#ffd700';ctx.fillText('Score '+G.score+'   •   Élims '+G.kills,16,58);
  ctx.fillStyle='#333';ctx.fillRect(16,64,232,10);
  const hpPct=Math.max(0,P.hp/P.maxHp);
  ctx.fillStyle=hpPct>0.3?'#ff8800':'#ff0000';ctx.fillRect(16,64,232*hpPct,10);
  ctx.fillStyle='#fff';ctx.font='bold 9px Arial';ctx.fillText('PV '+Math.max(0,Math.round(P.hp))+'/'+P.maxHp,110,72);
  // barre de progression
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(W-260,8,252,14);
  ctx.fillStyle='#4169E1';ctx.fillRect(W-258,10,248*Math.min(1,G.dist/G.target),10);
  ctx.fillStyle='#fff';ctx.font='bold 9px Arial';ctx.fillText('PROGRESSION',W-190,17);
  // boss bar
  if(G.boss){ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(W/2-200,H-34,400,20);
    ctx.fillStyle='#8b0000';ctx.fillRect(W/2-198,H-32,396*Math.max(0,G.bossHp/G.bossMax),16);
    ctx.fillStyle='#ffd700';ctx.font='bold 12px Arial';ctx.textAlign='center';
    ctx.fillText('☠ LE CHEF BANDIT ☠',W/2,H-19);ctx.textAlign='left';}
}
function logMsg(m,c){}

/* ---------- BOUCLE ---------- */
let last=0;
function loop(t){
  const dt=Math.min(0.033,(t-last)/1000);last=t;
  if(G.state==='play')update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------- ENTREES ---------- */
window.addEventListener('keydown',e=>{
  keys[e.key]=true;
  if(e.key===' ')e.preventDefault();
  if(G.state==='menu'&&(e.key===' '||e.key==='Enter'))newGame();
  if(G.state==='victory'||G.state==='gameover'){if(e.key==='Enter')newGame();}
});
window.addEventListener('keyup',e=>keys[e.key]=false);
cv.addEventListener('mousedown',()=>firing=true);
window.addEventListener('mouseup',()=>firing=false);
cv.addEventListener('touchstart',e=>{e.preventDefault();firing=true;}, {passive:false});
cv.addEventListener('touchend',()=>firing=false);

/* ---------- MENU ---------- */
OVT.innerHTML='LA MÉLO';
OVB.innerHTML=`<p class="g">RUN & GUN — infiltration du territoire ennemi</p>
  <p>Ton soldat court vers le QG. Des <span class="k">soldats ennemis</span> tirent sur toi.</p>
  <p><b class="c">10 niveaux</b> puis le <span class="k">CHEF BANDIT</span> t'attend à la fin.</p>
  <div class="stat">ESPACE = sauter &nbsp;•&nbsp; X / CLIC = tirer</div>
  <button onclick="newGame()">🪖 COMMENCER LA MISSION</button>
  <p class="small">Évite les balles en sautant, ramasse les trousses de soin (+25 PV).</p>`;
OV.style.display='flex';
</script>
</body>
</html>
