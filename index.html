<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MaxiRacer - Jeu de Course Pro</title>
<style>
  body { margin: 0; overflow: hidden; background: #000; font-family: 'Arial'; }
  canvas { display: block; }
  #ui {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    color: white; pointer-events: none;
  }
  #speed { position: absolute; bottom: 20px; right: 20px; font-size: 32px; font-weight: bold; color: #00e676; }
  #level { position: absolute; top: 20px; left: 20px; font-size: 24px; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px; }
  #controls { position: absolute; bottom: 20px; left: 20px; font-size: 14px; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px; }
  #startScreen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(135deg,#00c853,#00e676); display: flex;
    flex-direction: column; align-items: center; justify-content: center;
  }
  #startScreen h1 { font-size: 60px; margin: 0; }
  #startBtn { margin-top: 20px; padding: 15px 40px; font-size: 20px; background: #fff; color: #00c853; border: none; border-radius: 10px; cursor: pointer; pointer-events: all; font-weight: bold; }
</style>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>
<body>

<div id="startScreen">
  <h1>MAXI RACER</h1>
  <p>Niveau: 1 - Ville de Nuit</p>
  <button id="startBtn">COMMENCER LA COURSE</button>
</div>

<div id="ui" style="display:none">
  <div id="level">Niveau 1 / 5</div>
  <div id="speed">0 KM/H</div>
  <div id="controls">↑ Avancer | ↓ Freiner | ← → Diriger</div>
</div>

<script type="module">
import * as THREE from 'three';

// VARIABLES GLOBALES
let scene, camera, renderer, car, road;
let speed = 0, maxSpeed = 200, steer = 0;
let keys = {};
let level = 1;
let gameStarted = false;
let clock = new THREE.Clock();

// DÉMARRER LE JEU
document.getElementById('startBtn').onclick = () => {
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('ui').style.display = 'block';
  gameStarted = true;
  init();
  animate();
}

// INITIALISATION 3D
function init() {
  scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x000000, 50, 500);

  camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.set(0, 5, -15);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio); // Pour 60 FPS et graphiques élevés
  document.body.appendChild(renderer.domElement);

  // LUMIÈRE
  const ambient = new THREE.AmbientLight(0xffffff, 0.5);
  scene.add(ambient);
  const dirLight = new THREE.DirectionalLight(0xffffff, 1);
  dirLight.position.set(5, 10, 5);
  scene.add(dirLight);

  // ROUTE INFINIE
  const roadGeo = new THREE.PlaneGeometry(20, 2000);
  const roadMat = new THREE.MeshStandardMaterial({ color: 0x333 });
  road = new THREE.Mesh(roadGeo, roadMat);
  road.rotation.x = -Math.PI / 2;
  scene.add(road);

  // LIGNES BLANCHES
  for(let i = 0; i < 40; i++){
    const line = new THREE.Mesh(
      new THREE.BoxGeometry(0.5, 0.01, 5),
      new THREE.MeshBasicMaterial({color: 0xffffff})
    );
    line.position.set(0, 0.01, -i * 20);
    scene.add(line);
  }

  // VOITURE
  const carGroup = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(2, 1, 4), new THREE.MeshStandardMaterial({color: 0xff0000}));
  const roof = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.7, 2), new THREE.MeshStandardMaterial({color: 0x222}));
  roof.position.y = 0.85;
  roof.position.z = -0.2;
  carGroup.add(body, roof);
  car = carGroup;
  car.position.y = 0.5;
  scene.add(car);

  // CONTRÔLES CLAVIER
  window.addEventListener('keydown', e => keys[e.key] = true);
  window.addEventListener('keyup', e => keys[e.key] = false);
  window.addEventListener('resize', onResize);
}

// BOUCLE DE JEU 60 FPS
function animate() {
  if(!gameStarted) return;
  requestAnimationFrame(animate);
  
  const delta = clock.getDelta(); // Pour avoir 60 FPS stable

  // CONTRÔLES
  if(keys['ArrowUp']) speed += 100 * delta;
  if(keys['ArrowDown']) speed -= 150 * delta;
  if(keys['ArrowLeft']) steer = 1;
  else if(keys['ArrowRight']) steer = -1;
  else steer = 0;

  speed = Math.max(0, Math.min(speed, maxSpeed));
  speed *= 0.98; // Friction

  // DÉPLACEMENT
  car.position.x += steer * 10 * delta;
  car.position.x = Math.max(-8, Math.min(8, car.position.x)); // Limite route
  car.rotation.z = steer * 0.3;
  
  road.position.z += speed * delta;
  if(road.position.z > 100) road.position.z = 0; // Route infinie

  // CAMERA QUI SUIT
  camera.position.x += (car.position.x - camera.position.x) * 0.1;
  camera.lookAt(car.position);

  // UI
  document.getElementById('speed').innerText = Math.round(speed) + " KM/H";
  document.getElementById('level').innerText = `Niveau ${level} / 5`;

  // PASSER NIVEAU
  if(speed > 180 && level < 5){
    level++;
    maxSpeed += 20;
    scene.background = new THREE.Color(0x000011 + level * 20000); // Change décor
  }

  renderer.render(scene, camera);
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
</script>
</body>
</html>
