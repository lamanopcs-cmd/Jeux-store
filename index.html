<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LA MELO — Simulateur de Guerre</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: radial-gradient(circle at 50% 0%, #1a2a1a, #0a0f0a 70%);
    color:#e8e8e8;
    font-family:"Segoe UI", Arial, sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:10px;
  }
  #app { width:100%; max-width:700px; }
  .screen { display:none; }
  .screen.active { display:block; animation:fade .4s ease; }
  @keyframes fade { from{opacity:0; transform:translateY(8px);} to{opacity:1;} }

  .panel {
    background:linear-gradient(160deg, #1c2a1c, #121a12);
    border:2px solid #3a5a3a;
    border-radius:14px;
    padding:22px;
    box-shadow:0 0 30px rgba(60,160,60,.25);
    text-align:center;
  }

  h1 {
    font-size:52px;
    letter-spacing:6px;
    color:#7CFC00;
    text-shadow:0 0 20px #32CD32, 0 0 40px #228B22;
    margin-bottom:4px;
  }
  h2 { color:#9ACD32; margin:12px 0; letter-spacing:2px; }
  .subtitle { color:#aaa; margin-bottom:18px; font-style:italic; }

  .btn {
    display:block; width:100%;
    margin:10px 0; padding:14px;
    font-size:17px; font-weight:bold;
    color:#0a0f0a;
    background:linear-gradient(180deg,#9ACD32,#556B2F);
    border:none; border-radius:10px;
    cursor:pointer; transition:.15s;
    letter-spacing:1px;
  }
  .btn:hover { transform:scale(1.03); filter:brightness(1.15); }
  .btn:active { transform:scale(.97); }
  .btn.red  { background:linear-gradient(180deg,#cd5c5c,#8b0000); color:#fff; }
  .btn.blue { background:linear-gradient(180deg,#4682B4,#1a3a5a); color:#fff; }
  .btn.gold { background:linear-gradient(180deg,#ffd700,#b8860b); }
  .btn.gray { background:linear-gradient(180deg,#555,#222); color:#ddd; }

  .hud {
    display:grid; grid-template-columns:1fr 1fr;
    gap:10px; margin-bottom:14px;
  }
  .stat {
    background:#0d140d; border:1px solid #2e4a2e;
    border-radius:10px; padding:10px; text-align:center;
  }
  .stat .label { font-size:12px; color:#8a8a8a; text-transform:uppercase; }
  .stat .value { font-size:18px; font-weight:bold; color:#7CFC00; }

  .bar-wrap {
    background:#1a1a1a; border-radius:8px;
    height:20px; overflow:hidden; border:1px solid #333;
  }
  .bar { height:100%; transition:width .3s; }
  .bar.hp { background:linear-gradient(90deg,#ff4444,#ff8800); }
  .bar.xp { background:linear-gradient(90deg,#4169E1,#00BFFF); }
  .bar.enemy { background:linear-gradient(90deg,#ff0000,#ff5555); }

  .battle-box { background:#0b110b; border:1px solid #3a5a3a; border-radius:12px; padding:16px; margin:12px 0; }
  .enemy-line { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .enemy-name { color:#ff6b6b; font-weight:bold; font-size:18px; }
  .player-line { margin:10px 0; }

  .actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .actions .btn { margin:0; padding:10px; font-size:14px; }

  .log {
    background:#050a05; border:1px solid #2e4a2e;
    border-radius:10px; padding:10px;
    height:110px; overflow-y:auto;
    font-size:14px; text-align:left;
  }
  .log .dmg { color:#ff7b7b; }
  .log .heal { color:#7CFC00; }
  .log .gold { color:#ffd700; }
  .log .info { color:#87CEEB; }
  .log .crit { color:#ff00ff; font-weight:bold; }

  .rank { color:#DA70D6; font-weight:bold; }
  .boss-banner {
    background:linear-gradient(90deg,#3a0000,#7a0000,#3a0000);
    color:#ffd700; font-weight:bold; padding:8px;
    border-radius:8px; margin:8px 0; letter-spacing:2px;
    animation:pulse 1s infinite;
  }
  @keyframes pulse { 50% { opacity:.6; } }

  input[type=text] {
    width:100%; padding:12px; font-size:17px;
    background:#0d140d; color:#7CFC00;
    border:2px solid #3a5a3a; border-radius:10px;
    text-align:center; margin:10px 0; outline:none;
  }
  .small { font-size:13px; color:#888; margin-top:10px; }
</style>
</head>
<body>
<div id="app">

  <!-- ═══════════════ MENU PRINCIPAL ═══════════════ -->
  <div id="screen-menu" class="screen active">
    <div class="panel">
      <h1>LA MÉLO</h1>
      <div class="subtitle">⚔ Simulateur de Guerre — 100 Niveaux ⚔</div>
      <button class="btn" onclick="newGame()">🪖 Nouvelle Partie</button>
      <button class="btn gold" onclick="loadGame()">📂 Charger la Sauvegarde</button>
      <button class="btn red" onclick="confirm('Tu veux vraiment abandonner, soldat ?') || location.reload()">🚪 Quitter</button>
      <div class="small">Grade, armes, armures, boss tous les 10 niveaux.<br>Sauvegarde automatique dans ton navigateur.</div>
    </div>
  </div>

  <!-- ═══════════════ ÉCRAN JEU ═══════════════ -->
  <div id="screen-game" class="screen">
    <div class="panel">
      <h2 id="game-title">—</h2>

      <!-- HUD -->
      <div class="hud" id="hud"></div>
      <div class="bar-wrap" style="margin-bottom:4px;">
        <div class="bar hp" id="hpbar"></div>
      </div>
      <div style="font-size:12px;color:#999;margin-bottom:6px;" id="hptext"></div>
      <div class="bar-wrap" style="margin-bottom:14px;">
        <div class="bar xp" id="xpbar"></div>
      </div>

      <!-- ZONE DE COMBAT -->
      <div class="battle-box" id="battle"></div>

      <!-- JOURNAL -->
      <div class="log" id="log"></div>
    </div>
  </div>

  <!-- ═══════════════ ARMURERIE ═══════════════ -->
  <div id="screen-shop" class="screen">
    <div class="panel">
      <h2>🔧 ARMURERIE DE LA MÉLO</h2>
      <div class="hud" id="shop-hud"></div>
      <button class="btn" id="btn-weapon" onclick="buyWeapon()">—</button>
      <button class="btn blue" id="btn-armor" onclick="buyArmor()">—</button>
      <button class="btn gold" onclick="buyMedkit()">💊 Acheter une trousse de soin (75 or)</button>
      <button class="btn gray" onclick="showScreen('game')">⬅ Retour au front</button>
    </div>
  </div>

</div>

<script>
/* ═══════════════════ DONNÉES DU JEU ═══════════════════ */
const RANKS = [
  [0,"Recrue"],[5,"Soldat"],[10,"Caporal"],[15,"Sergent"],[25,"Adjudant"],
  [35,"Lieutenant"],[45,"Capitaine"],[55,"Commandant"],[65,"Colonel"],
  [75,"Général de brigade"],[85,"Général de division"],[95,"Général d'armée"],
  [100,"LÉGENDE DE LA MÉLO"]
];

const WEAPONS = [
  {name:"Pistolet M9", dmg:12, cost:0},
  {name:"Fusil AK-47", dmg:22, cost:50},
  {name:"Sniper AWM", dmg:35, cost:150},
  {name:"Lance-grenades M79", dmg:50, cost:300},
  {name:"Mitrailleuse M249", dmg:68, cost:500},
  {name:"Lance-roquettes RPG-7", dmg:90, cost:800},
  {name:"Canon anti-char", dmg:115, cost:1200},
  {name:"Railgun tactique", dmg:145, cost:1800},
  {name:"Système de missiles", dmg:180, cost:2500},
  {name:"Artillerie orbitale", dmg:220, cost:3500},
  {name:"Fusil à plasma MK-X", dmg:270, cost:5000},
  {name:"Juggernaut Nucleon", dmg:320, cost:7000}
];

const ARMORS = [
  {name:"Gilet tactique", def:10, cost:0},
  {name:"Armure renforcée", def:25, cost:200},
  {name:"Armure composite", def:45, cost:500},
  {name:"Exosquelette léger", def:70, cost:900},
  {name:"Armure réactive", def:100, cost:1500},
  {name:"Exosquelette lourd", def:140, cost:2400},
  {name:"Nanotechnologie", def:190, cost:4000},
  {name:"Armure Titan", def:250, cost:6000}
];

const BOSSES = {
  10:["GÉNÉRAL BRUTUS",600,30,300,400],
  20:["COLONEL VIPÈRE",1400,45,500,700],
  30:["COMMANDANT FALCON",2600,60,750,1000],
  40:["TANK DU DÉSERT",4200,80,1000,1400],
  50:["FORTERESSE VOLANTE",6500,100,1500,2000],
  60:["CYBORG NULL",9500,120,2000,2800],
  70:["SATELITE DE GUERRE",13500,150,2600,3800],
  80:["GÉNÉRAL OMÉGA",18500,180,3400,5000],
  90:["MÉGA RONGEUR",25000,220,4500,6500],
  100:["L'EMPEREUR DE LA MÉLO",40000,280,10000,15000]
};

const ENEMY_TYPES = ["Fantassin ennemi","Tireur embusqué","Soldat d'élite","Bunker fortifié","Char de combat","Hélicoptère d'attaque"];

/* ═══════════════════ ÉTAT DU JOUEUR ═══════════════════ */
let P = null;
let enemy = null;
let defending = false;

function defaultPlayer(name){
  return {
    name:name || "Commandant",
    level:1, hp:100, maxHp:100,
    gold:100, xp:0, xpNext:100,
    weapon:0, armor:0, medkits:3,
    kills:0, wins:0
  };
}

function rankFor(lvl){
  let r = RANKS[0][1];
  for(const [l,n] of RANKS) if(lvl>=l) r=n;
  return r;
}
function critChance(){ return Math.min(0.05 + P.level*0.002, 0.30); }

/* ═══════════════════ ENNEMIS ═══════════════════ */
function makeEnemy(){
  const b = BOSSES[P.level];
  if(b) return {name:b[0], hp:b[1], maxHp:b[1], dmg:b[2], xp:b[3], gold:b[4], boss:true};
  const baseHp = 18 + P.level*6;
  const baseDmg = 4 + P.level*2;
  const t = ENEMY_TYPES[Math.floor(Math.random()*ENEMY_TYPES.length)];
  let hp=baseHp, dmg=baseDmg, mult=1;
  switch(t){
    case "Tireur embusqué":    hp=baseHp*0.7;  dmg=baseDmg*1.4; mult=1.1; break;
    case "Soldat d'élite":     hp=baseHp*1.2;  dmg=baseDmg*1.1; mult=1.2; break;
    case "Bunker fortifié":    hp=baseHp*1.8;  dmg=baseDmg*0.7; mult=1.4; break;
    case "Char de combat":     hp=baseHp*2.2;  dmg=baseDmg*1.3; mult=1.8; break;
    case "Hélicoptère d'attaque": hp=baseHp*1.5; dmg=baseDmg*1.8; mult=2.2; break;
  }
  return {
    name:t, hp:Math.round(hp), maxHp:Math.round(hp),
    dmg:Math.round(dmg),
    xp:Math.round(20+P.level*3*mult),
    gold:Math.round(15+P.level*2*mult),
    boss:false
  };
}

/* ═══════════════════ LOG & RENDU ═══════════════════ */
function log(msg, cls){
  const el = document.getElementById('log');
  el.innerHTML += `<div class="${cls||'info'}">${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

function renderHUD(){
  const w = WEAPONS[P.weapon], a = ARMORS[P.armor];
  document.getElementById('game-title').innerHTML =
    `🪖 ${P.name} — <span class="rank">${rankFor(P.level)}</span>`;
  document.getElementById('hud').innerHTML = `
    <div class="stat"><div class="label">Niveau</div><div class="value">${P.level}/100</div></div>
    <div class="stat"><div class="label">Or</div><div class="value" style="color:#ffd700">${P.gold}</div></div>
    <div class="stat"><div class="label">Arme</div><div class="value" style="font-size:13px">${w.name} (${w.dmg})</div></div>
    <div class="stat"><div class="label">Armure</div><div class="value" style="font-size:13px">${a.name} (${a.def})</div></div>
    <div class="stat"><div class="label">💊 Trousse</div><div class="value">${P.medkits}</div></div>
    <div class="stat"><div class="label">Victoires / Élims</div><div class="value" style="font-size:13px">${P.wins} / ${P.kills}</div></div>`;
  const hpPct = Math.max(0, P.hp/P.maxHp*100);
  const xpPct = Math.min(100, P.xp/P.xpNext*100);
  document.getElementById('hpbar').style.width = hpPct+'%';
  document.getElementById('hptext').textContent = `PV : ${P.hp} / ${P.maxHp}`;
  document.getElementById('xpbar').style.width = xpPct+'%';
}

function renderBattle(){
  const b = document.getElementById('battle');
  const ePct = Math.max(0, enemy.hp/enemy.maxHp*100);
  const bossHTML = enemy.boss ? `<div class="boss-banner">☠ BOSS DU NIVEAU ${P.level} ☠</div>` : '';
  b.innerHTML = `
    ${bossHTML}
    <div class="enemy-line">
      <span class="enemy-name">${enemy.boss?'👹':'👤'} ${enemy.name}</span>
      <span>${enemy.hp} / ${enemy.maxHp} PV</span>
    </div>
    <div class="bar-wrap"><div class="bar enemy" style="width:${ePct}%"></div></div>
    <div class="player-line">💂 Vous : ${P.hp} / ${P.maxHp} PV</div>
    <div class="actions">
      <button class="btn" onclick="doAttack()">⚔ Attaquer</button>
      <button class="btn blue" onclick="doPrecise()">🎯 Tir précis (50 or)</button>
      <button class="btn gold" onclick="doMedkit()">💊 Soin (${P.medkits})</button>
      <button class="btn gray" onclick="doDefend()">🛡 Défendre</button>
    </div>`;
}

function renderShop(){
  document.getElementById('shop-hud').innerHTML = `
    <div class="stat"><div class="label">Or</div><div class="value" style="color:#ffd700">${P.gold}</div></div>
    <div class="stat"><div class="label">Niveau</div><div class="value">${P.level}/100</div></div>`;
  const nw = WEAPONS[P.weapon+1];
  document.getElementById('btn-weapon').textContent = nw
    ? `🔫 ${nw.name} (${nw.dmg} dégâts) — ${nw.cost} or`
    : "🔫 Arme au MAXIMUM";
  document.getElementById('btn-weapon').disabled = !nw || P.gold < nw.cost;
  const na = ARMORS[P.armor+1];
  document.getElementById('btn-armor').textContent = na
    ? `🛡 ${na.name} (${na.def} défense) — ${na.cost} or`
    : "🛡 Armure au MAXIMUM";
  document.getElementById('btn-armor').disabled = !na || P.gold < na.cost;
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
  if(id==='game'){ renderHUD(); renderBattle(); }
  if(id==='shop') renderShop();
}

/* ═══════════════════ COMBAT ═══════════════════ */
function enemyTurn(){
  if(enemy.hp<=0 || P.hp<=0) return;
  let dmg = Math.max(1, enemy.dmg - ARMORS[P.armor].def);
  if(defending) dmg = Math.max(1, Math.round(dmg*0.35));
  P.hp -= dmg;
  log(`☠ ${enemy.name} t'attaque : <span class="dmg">-${dmg} PV</span>`, 'dmg');
  defending = false;
  checkEnd();
}

function checkEnd(){
  if(P.hp <= 0){
    P.hp = 0;
    renderHUD(); renderBattle();
    log(`💀 <b>${P.name} est tombé au niveau ${P.level}...</b>`, 'crit');
    log('🪖 La MÉLO se souviendra de toi.', 'info');
    saveGame();
    setTimeout(()=>showScreen('menu'), 2500);
    return true;
  }
  if(enemy.hp <= 0){
    P.kills++; P.wins++;
    P.gold += enemy.gold;
    log(`✅ VICTOIRE ! +<span class="gold">${enemy.gold} or</span>`, 'heal');
    addXP(enemy.xp);
    saveGame();
    if(P.level>=100){ victory(); return true; }
    setTimeout(()=>{ enemy = makeEnemy(); renderBattle(); }, 900);
    return true;
  }
  return false;
}

function addXP(amount){
  P.xp += amount;
  while(P.xp >= P.xpNext){
    P.xp -= P.xpNext;
    P.level++;
    P.maxHp += 15;
    P.hp = P.maxHp;
    P.xpNext = Math.round(P.xpNext*1.35);
    log(`⬆ <b>NIVEAU ${P.level} !</b> +15 PV max`, 'heal');
    if(P.level>=100){ P.level=100; break; }
  }
  renderHUD();
}

function victory(){
  document.getElementById('battle').innerHTML =
    `<h2 style="color:#ffd700">🏆🏆🏆</h2>
     <h2 style="color:#7CFC00">FÉLICITATIONS, ${P.name} !</h2>
     <p>Tu as conquis les <b>100 niveaux</b> de LA MÉLO.</p>
     <p class="rank">LÉGENDE ÉTERNELLE</p>
     <button class="btn gold" onclick="showScreen('menu')">🏆 Continuer en mode libre</button>`;
  log('🏆 <b>100 NIVEAUX CONQUIS !</b>', 'crit');
}

/* Actions du joueur */
function doAttack(){
  let dmg = Math.round(WEAPONS[P.weapon].dmg * (0.75 + Math.random()*0.5));
  let crit = Math.random() < critChance();
  if(crit) dmg = Math.round(dmg*2);
  enemy.hp -= dmg;
  log(`⚔ Tu infliges <span class="dmg">${dmg}</span> dégâts${crit?' <span class="crit">(CRITIQUE !)</span>':''}`);
  renderBattle();
  if(!checkEnd()) enemyTurn();
}

function doPrecise(){
  if(P.gold < 50){ log('❌ Pas assez d\'or (50 requis).','crit'); return; }
  P.gold -= 50;
  const dmg = Math.round(WEAPONS[P.weapon].dmg * 2.2);
  enemy.hp -= dmg;
  log(`🎯 TIR PRÉCIS : <span class="crit">${dmg}</span> dégâts garantis !`);
  renderHUD(); renderBattle();
  if(!checkEnd()) enemyTurn();
}

function doMedkit(){
  if(P.medkits<=0){ log('❌ Plus de trousse de soin !','crit'); return; }
  P.medkits--;
  const heal = Math.min(45, P.maxHp - P.hp);
  P.hp += heal;
  log(`💊 +${heal} PV restaurés.`, 'heal');
  renderHUD(); renderBattle();
  if(!checkEnd()) enemyTurn();
}

function doDefend(){
  defending = true;
  log('🛡 Position défensive : dégâts subis réduits à 35%.','info');
  enemyTurn();
}

/* ═══════════════════ ARMURERIE ═══════════════════ */
function buyWeapon(){
  const nw = WEAPONS[P.weapon+1];
  if(!nw){ log('Arme déjà max.','crit'); return; }
  if(P.gold < nw.cost){ log('Pas assez d\'or.','crit'); return; }
  P.gold -= nw.cost; P.weapon++;
  log(`🔫 Nouvelle arme : <b>${nw.name}</b> !`,'gold');
  renderShop();
}
function buyArmor(){
  const na = ARMORS[P.armor+1];
  if(!na){ log('Armure déjà max.','crit'); return; }
  if(P.gold < na.cost){ log('Pas assez d\'or.','crit'); return; }
  P.gold -= na.cost; P.armor++;
  log(`🛡 Nouvelle armure : <b>${na.name}</b> !`,'gold');
  renderShop();
}
function buyMedkit(){
  if(P.gold<75){ log('Pas assez d\'or.','crit'); return; }
  P.gold-=75; P.medkits++;
  log('💊 +1 trousse de soin.','heal');
  renderShop();
}

/* ═══════════════════ SAUVEGARDE ═══════════════════ */
function saveGame(){
  try{ localStorage.setItem('lamelo_save', JSON.stringify(P)); }catch(e){}
}
function loadGame(){
  try{
    const d = JSON.parse(localStorage.getItem('lamelo_save'));
    if(!d){ alert('Aucune sauvegarde trouvée. Nouvelle partie !'); return; }
    P = d;
    enemy = makeEnemy();
    log(`📂 Bienvenue de retour, <b>${P.name}</b> !`, 'info');
    showScreen('game');
  }catch(e){ alert('Sauvegarde illisible.'); }
}

/* ═══════════════════ NOUVELLE PARTIE ═══════════════════ */
function newGame(){
  const name = prompt("Nom de ton commandant :", "Commandant") || "Commandant";
  P = defaultPlayer(name);
  enemy = makeEnemy();
  document.getElementById('log').innerHTML = '';
  log(`🪖 Bienvenue, <b>${name}</b>. La guerre commence. Niveau 1.`,'info');
  showScreen('game');
}
</script>
</body>
</html>
